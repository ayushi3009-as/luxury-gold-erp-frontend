<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Gold ERP - Intro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;600&display=swap');
        
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .bg-pattern {
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(217, 169, 40, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(217, 169, 40, 0.05) 0%, transparent 50%);
            z-index: 1;
        }

        .content {
            z-index: 10;
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 2s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
        }

        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #111, #000);
            border: 1px solid rgba(217, 169, 40, 0.3);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 40px rgba(217, 169, 40, 0.15);
            opacity: 0;
            transform: scale(0.9);
            animation: scaleIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) 1s forwards;
        }

        .title {
            font-family: 'Playfair Display', serif;
            font-size: 4.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #d9a928, #f5d77f, #d9a928);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 15px 0;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 1.25rem;
            color: #888;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-weight: 300;
        }

        .presenter {
            margin-top: 60px;
            opacity: 0;
            animation: fadeIn 2s ease 2.5s forwards;
        }

        .presenter-title {
            color: #d9a928;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 5px;
        }

        .presenter-name {
            font-size: 1.5rem;
            font-weight: 600;
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes scaleIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        /* Animated gold dust */
        .dust {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #d9a928;
            border-radius: 50%;
            box-shadow: 0 0 10px #d9a928;
            opacity: 0;
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    
    <!-- Dynamic gold particles -->
    <div id="particles"></div>

    <div class="content">
        <div class="logo">
            <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#d9a928" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="m2 12 5.25 5 2.625-10 3.937 10 2.625-10L22 12"/>
            </svg>
        </div>
        
        <h1 class="title">Luxury Gold</h1>
        <p class="subtitle">Jewellery ERP System</p>

        <div class="presenter">
            <p class="presenter-title">Marketing Strategy & Platform Demo</p>
            <!-- User can edit their name here if they open the file locally -->
            <p class="presenter-name">Digital Marketing Candidate</p>
        </div>
    </div>

    <script>
        // Create ambient floating gold particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 40; i++) {
            const particle = document.createElement('div');
            particle.className = 'dust';
            
            // Random positioning
            particle.style.left = Math.random() * 100 + 'vw';
            particle.style.top = Math.random() * 100 + 'vh';
            
            // Random animation duration and delay
            const duration = 10 + Math.random() * 20;
            const delay = Math.random() * 10;
            
            particle.animate([
                { transform: 'translateY(0) scale(0)', opacity: 0 },
                { transform: 'translateY(-100px) scale(1)', opacity: Math.random() * 0.5 + 0.1, offset: 0.5 },
                { transform: 'translateY(-200px) scale(0)', opacity: 0 }
            ], {
                duration: duration * 1000,
                delay: delay * 1000,
                iterations: Infinity,
                easing: 'ease-in-out'
            });
            
            particlesContainer.appendChild(particle);
        }
    </script>
</body>
</html>
